<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 240" fill="none" className="cert-logo">
  <defs>
    <!-- 3D Sphere Radial Gradient -->
    <radialGradient id="certSphereGrad" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="15%" stop-color="#34d399" />
      <stop offset="45%" stop-color="#00a884" />
      <stop offset="80%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </radialGradient>

    <!-- Specular Highlight for Globe -->
    <radialGradient id="certSphereHighlight" cx="42%" cy="35%" r="40%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Swoosh Gradient (Purple/Violet) -->
    <linearGradient id="certSwooshGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4c1d68" />
      <stop offset="50%" stop-color="#581c6f" />
      <stop offset="100%" stop-color="#6b2185" />
    </linearGradient>

    <!-- Shadow for Sphere Depth -->
    <filter id="certSphereGlow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#064e3b" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- 1. The 3D Green/Teal Sphere Globe inside the C -->
  <g id="globe">
    <!-- Base 3D Sphere -->
    <circle cx="94" cy="116" r="46" fill="url(#certSphereGrad)" filter="url(#certSphereGlow)" />
    <!-- Secondary Specular Highlight -->
    <ellipse cx="88" cy="100" rx="20" ry="14" fill="url(#certSphereHighlight)" />
  </g>

  <!-- 2. The Letter 'C' enclosing the globe (CERT Blue: #4477b2) -->
  <path
    d="M 132,66
       C 120,53 105,45 88,45
       C 50,45 22,76 22,118
       C 22,160 50,191 88,191
       C 107,191 123,181 134,166
       L 125,152
       C 116,165 103,174 88,174
       C 60,174 38,150 38,118
       C 38,86 60,62 88,62
       C 102,62 114,69 123,80
       Z"
    fill="#4477b2"
  />

  <!-- 3. The Letter 'E' -->
  <path
    d="M 152,48
       L 230,48
       L 230,64
       L 171,64
       L 171,110
       L 224,110
       L 224,126
       L 171,126
       L 171,172
       L 232,172
       L 232,188
       L 152,188
       Z"
    fill="#4477b2"
  />

  <!-- 4. The Letter 'R' with characteristic curved leg -->
  <path
    d="M 248,48
       L 298,48
       C 318,48 333,59 333,78
       C 333,94 322,106 304,110
       C 315,116 322,126 329,144
       C 334,158 340,174 346,188
       L 326,188
       C 320,174 314,158 309,144
       C 303,130 297,123 283,123
       L 267,123
       L 267,188
       L 248,188
       Z
       M 267,64
       L 267,108
       L 295,108
       C 307,108 314,100 314,86
       C 314,72 307,64 295,64
       Z"
    fill="#4477b2"
  />

  <!-- 5. The Letter 'T' -->
  <path
    d="M 334,48
       L 424,48
       L 424,64
       L 389,64
       L 389,188
       L 370,188
       L 370,64
       L 334,64
       Z"
    fill="#4477b2"
  />

  <!-- 6. The Dynamic Purple Orbital Swoosh slicing through CERT -->
  <path
    d="M 20,132
       C 18,142 24,148 35,148
       C 52,148 80,140 108,131
       C 152,117 210,98 280,75
       C 340,55 395,33 434,2
       C 436,1 437,0 438,0
       C 437,3 410,24 374,44
       C 310,80 242,107 182,128
       C 128,147 78,162 48,162
       C 24,162 14,150 14,138
       C 14,133 16,128 20,123
       Z"
    fill="url(#certSwooshGrad)"
  />
</svg>
